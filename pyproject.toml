[project]
name = "excali-builder"
version = "0.1.0"
description = "A local-only modular Python package that creates bidirectional graphs from source files and renders them as Excalidraw diagrams"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.0.0",
]

[project.scripts]
excali-builder = "excali_builder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

